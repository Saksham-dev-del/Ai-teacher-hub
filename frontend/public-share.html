<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Academic Resource</title><link rel="stylesheet" href="css/styles.css"><style>body{padding:28px}.public-wrap{max-width:980px;margin:auto}.public-card{background:white;border:1px solid #e2e8f0;border-radius:28px;padding:32px;box-shadow:0 24px 70px rgba(15,23,42,.12)}.public-section{padding:18px;margin:14px 0;background:#f8fafc;border-radius:18px}.public-meta{color:#64748b}.public-rating{display:inline-flex;padding:7px 11px;background:#fef3c7;color:#92400e;border-radius:999px;font-weight:800}</style></head><body><main class="public-wrap"><div id="shared-resource" class="public-card"><p>Loading shared resource…</p></div></main><script>const code=new URLSearchParams(location.search).get('code');const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));fetch('/api/collaboration/public/'+encodeURIComponent(code||'')).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok)throw new Error(d.error||'Unavailable');const r=d.resource;const sections=(r.reportSections||r.sections||[]).map((s,i)=>`<section class="public-section"><h2>${esc(s.heading||s.title||s.h||'Section '+(i+1))}</h2><p>${esc(s.summary||s.body||s.b||'')}</p>${(s.explanation||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</section>`).join('');document.getElementById('shared-resource').innerHTML=`<span class="public-rating">★ ${Number(r.ratingAverage||0).toFixed(1)} (${r.ratingCount||0})</span><h1>${esc(r.topic)}</h1><p class="public-meta">${esc(r.type)} · ${esc(r.course)} · ${esc(r.subject)} · Shared by ${esc(r.ownerName)}</p>${r.executiveSummary?`<section class="public-section"><h2>Summary</h2><p>${esc(r.executiveSummary)}</p></section>`:''}${sections||'<p>No displayable sections were found.</p>'}<p class="public-meta">Views: ${d.views} · Teacher review status: ${esc(r.workflowStatus)}</p>`}).catch(e=>{document.getElementById('shared-resource').innerHTML=`<h1>Resource unavailable</h1><p>${esc(e.message)}</p>`})</script></body></html>
